# ==================================================
# BetterScoreboard Configuration
# ==================================================

scoreboard:
  # Enable or disable the scoreboard.
  enabled: true

  # Scoreboard title.
  title: "§6§lBetterScoreboard"

  # Scoreboard lines.
  #
  # Available placeholders:
  # SimplePAPI placeholders:
  # %player_name%        - Player name
  # %player_uuid%        - Player UUID
  # %player_ping%        - Player ping
  # %server_online%      - Current online player count
  # %server_max_players% - Maximum player count
  #
  # StonePerms placeholders provided through SimplePAPI:
  # %stoneperms_primary_group%               - Primary group / rank
  # %stoneperms_groups%                      - Player groups
  # %stoneperms_prefix%                      - Group prefix
  # %stoneperms_suffix%                      - Group suffix
  # %stoneperms_tracks%                      - Player tracks
  # %stoneperms_meta_<key>%                  - Metadata value
  # %stoneperms_permission_<permission>%     - Permission decision
  # %stoneperms_has_permission_<permission>% - Permission status
  # %stoneperms_track_<track>%               - Groups in a track
  lines:
    - "§7──────────────"
    - "§fPlayer: §e{player}"
    - "§fOnline: §a{online}/{max_players}"
    - "§7──────────────"

  # Update interval in ticks.
  #
  # 20 ticks = 1 second.
  update-interval: 20
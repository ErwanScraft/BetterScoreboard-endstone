# ==================================================
# BetterScoreboard Configuration
# ==================================================

scoreboard:
  # Enable or disable the scoreboard.
  enabled: true

  # Scoreboard title.
  title: "§6§lBetterScoreboard"

  # Scoreboard lines.
  #
  # Available placeholders:
  # SimplePAPI placeholders:
  # %player_name%        - Player name
  # %player_uuid%        - Player UUID
  # %player_ping%        - Player ping
  # %server_online%      - Current online player count
  # %server_max_players% - Maximum player count
  #
  # StonePerms placeholders:
  # {stoneperms:primary_group}
  # {stoneperms:groups}
  # {stoneperms:prefix}
  # {stoneperms:suffix}
  # {stoneperms:tracks}
  # {stoneperms:meta_map}
  # {stoneperms:meta:<key>}
  # {stoneperms:permission:<permission>}
  # {stoneperms:has_permission:<permission>}
  # {stoneperms:track:<track>}
  lines:
    - "§7──────────────"
    - "§fPlayer: §e{player}"
    - "§fOnline: §a{online}/{max_players}"
    - "§7──────────────"

  # Update interval in ticks.
  #
  # 20 ticks = 1 second.
  update-interval: 20